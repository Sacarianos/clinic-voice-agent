name: CI

on:
  push:

jobs:
  verify:
    name: Every suite against a fresh stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: adapter/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: adapter/pnpm-lock.yaml
      # setup-uv publishes no floating v10 tag, so pin the v10.2.0 commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: |
            agent/uv.lock
            evals/uv.lock
            fhir/uv.lock
      # The script a developer runs: it starts HAPI, the seed and the adapter with Compose, runs the adapter,
      # agent, evals and seed suites against them, and prints one line per suite. Fakes stand in for Deepgram
      # and the LLM, so no API keys are needed, and real evals cost money and never run here.
      - run: scripts/verify
