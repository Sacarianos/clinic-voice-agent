summary: A Patient gets a hard Provider name wrong and the agent still finds the right Provider.
patient: {given: Soledad, family: Ibarra}
provider: {given: Theodora, family: Papadopoulos}
slots:
  only: {weekday: 2, at: "11:00"}
caller:
  goal: Book your annual physical with Dr. Theodora Papadopoulos on {only_day}.
  twist: >-
    You only half remember the doctor's name. Always say it the way it sounds, wrongly, as "Dr. Pappa
