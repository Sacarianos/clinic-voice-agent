[project]
name = "clinic-seed"
version = "0.1.0"
description = "Seeds the local HAPI FHIR server with the fictional clinic: Synthea Patients, Providers, Schedules and Slots."
requires-python = ">=3.12,<3.13"
dependencies = ["tzdata>=2024.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
